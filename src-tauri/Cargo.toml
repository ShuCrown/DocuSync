[package]
name = "docusync-tauri"
version = "0.0.24"
description = "DocuSync with DeepSeek Chat"
authors = ["you"]
edition = "2021"

[lib]
name = "docusync_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[features]
devtools = ["tauri/devtools"]

# macOS-only native bindings (used by `platform::macos` to read the real
# titlebar safe-area via NSWindow.contentLayoutRect).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
