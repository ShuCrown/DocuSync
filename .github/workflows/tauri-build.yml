name: Tauri Desktop Build & Release

# 每次 push 到 master（源码或构建配置变更）触发：
#   1. 自动 patch 版本自增（0.0.1 -> 0.0.2 -> 0.0.3 ...）
#   2. 三平台并行构建（Linux / Windows / macOS）
#   3. 在 GitHub Releases 页面发布可下载资源
on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  bump-version:
    name: Bump patch version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT="${{ steps.read.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          # 缺位补 0
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          TAG="v$NEW_VERSION"
          echo "New version: $NEW_VERSION, tag: $TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"
          # tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          # Cargo.toml（仅替换 [package] 段中的 version = "..."）
          sed -i -E '0,/^version = "[0-9.]+"$/ s/^version = "[0-9.]+"$/version = "'"$NEW_VERSION"'"/' src-tauri/Cargo.toml
          # package.json
          tmp2=$(mktemp)
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > "$tmp2" && mv "$tmp2" package.json
          echo "---- tauri.conf.json ----"
          jq '.version' src-tauri/tauri.conf.json
          echo "---- Cargo.toml ----"
          grep '^version' src-tauri/Cargo.toml
          echo "---- package.json ----"
          jq '.version' package.json

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build ${{ matrix.name }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux x64
            artifact_name: DocuSync-linux-x64
          - platform: windows-latest
            name: Windows x64
            artifact_name: DocuSync-windows-x64
          - platform: macos-latest
            name: macOS ARM64
            artifact_name: DocuSync-macos-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: List build output (Linux)
        if: runner.os == 'Linux'
        run: find src-tauri/target/release/bundle -type f 2>/dev/null | sort

      - name: List build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msi,*.exe -Path src-tauri/target/release/bundle | Select-Object -ExpandProperty FullName

      - name: List build output (macOS)
        if: runner.os == 'macOS'
        run: find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null | sort

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts to release/
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten release directory
        run: |
          mkdir -p release-flat
          find release -type f -exec cp {} release-flat/ \;
          echo "---- release tree ----"
          find release -type f | sort
          echo "---- flattened ----"
          ls -la release-flat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: DocuSync ${{ needs.bump-version.outputs.tag }}
          body: |
            ## DocuSync ${{ needs.bump-version.outputs.tag }}

            自动构建发布。版本由 `0.0.1` 起，每次合并到 master 后 patch 自增。

            ### 下载资源
            - **Windows**: `.msi` (安装包) / `.exe` (NSIS 安装包)
            - **macOS**: `.dmg` (磁盘镜像，ARM64 Apple Silicon)
            - **Linux**: `.deb` / `.rpm` / `.AppImage`
          generate_release_notes: true
          files: release-flat/*
