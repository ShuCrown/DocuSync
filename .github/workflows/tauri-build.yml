name: Tauri Desktop Build & Release

# 每次 push 到 master（源码或构建配置变更）触发：
#   1. 自动 patch 版本自增（0.0.1 -> 0.0.2 -> 0.0.3 ...）
#   2. 双平台并行构建（Windows / macOS ARM64）
#   3. 在 GitHub Releases 页面发布可下载资源
on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  bump-version:
    name: Bump patch version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT="${{ steps.read.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          # 缺位补 0
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          TAG="v$NEW_VERSION"
          echo "New version: $NEW_VERSION, tag: $TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"
          # tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          # Cargo.toml（仅替换 [package] 段中的 version = "..."）
          sed -i -E '0,/^version = "[0-9.]+"$/ s/^version = "[0-9.]+"$/version = "'"$NEW_VERSION"'"/' src-tauri/Cargo.toml
          # package.json
          tmp2=$(mktemp)
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > "$tmp2" && mv "$tmp2" package.json
          echo "---- tauri.conf.json ----"
          jq '.version' src-tauri/tauri.conf.json
          echo "---- Cargo.toml ----"
          grep '^version' src-tauri/Cargo.toml
          echo "---- package.json ----"
          jq '.version' package.json

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build ${{ matrix.name }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64
            artifact_name: DocuSync-windows-x64
          - platform: macos-latest
            name: macOS ARM64
            artifact_name: DocuSync-macos-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      # Cargo cache restores src-tauri/target, which carries stale bundle/
      # installers from an earlier release (e.g. a 0.0.2 .exe/.msi). Without
      # cleaning, the upload glob below publishes those old artifacts into the
      # new release. Remove the bundle output so only the current version ships.
      # shell: bash is required — the Windows runner defaults to pwsh, where
      # `rm -rf` is invalid and would fail this step.
      - name: Clean stale bundle artifacts
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          # Signing key for the updater bundles (.sig). Without these the build
          # produces unsigned updater artifacts and the release step will fail.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse -Path src-tauri/target/release/bundle | Select-Object -ExpandProperty FullName

      - name: List build output (macOS)
        if: runner.os == 'macOS'
        run: find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null | sort

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can list the commits since the last release.
          fetch-depth: 0
          fetch-tags: true

      - name: Build release notes from commits
        run: |
          CURRENT_TAG="${{ needs.bump-version.outputs.tag }}"
          # Most recent tag before the current one (the previous release).
          PREV_TAG=$(git tag --sort=-v:refname | grep -v -Fx "$CURRENT_TAG" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi
          echo "Release notes range: $RANGE"
          # Commit subjects since the last release. Skip merge commits and the
          # version-bump commit itself (it carries no user-facing change).
          CHANGES=$(git log "$RANGE" --pretty=format:"- %s" --no-merges \
                    | grep -v "^- chore(release): bump version" || true)
          if [ -z "$CHANGES" ]; then
            CHANGES="- (无显式提交记录)"
          fi
          {
            echo "## DocuSync ${CURRENT_TAG}"
            echo ""
            echo "### 本次更新"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "### 下载资源"
            echo "- **Windows**: \`.msi\` (安装包) / \`.exe\` (NSIS 安装包)"
            echo "- **macOS**: \`.dmg\` (磁盘镜像，Apple Silicon ARM64)"
          } > release_body.md
          echo "---- release_body.md ----"
          cat release_body.md

      - name: Download all artifacts to release/
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten release directory
        run: |
          mkdir -p release-flat
          find release -type f -exec cp {} release-flat/ \;
          echo "---- release tree ----"
          find release -type f | sort
          echo "---- flattened ----"
          ls -la release-flat

      - name: Generate updater manifest (latest.json)
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          TAG: ${{ needs.bump-version.outputs.tag }}
        run: |
          BASE="https://github.com/ShuCrown/DocuSync/releases/download/${TAG}"
          # Updater artifacts are the only build outputs with a .sig sidecar.
          # Discover them by signature so this is robust to Tauri's exact naming
          # (2.11.4 omits the version, e.g. DocuSync.app.tar.gz).
          echo "All signature files:"; find release-flat -name '*.sig' | sort
          MAC_SIG=$(find release-flat -name '*.app.tar.gz.sig' | head -n 1)
          WIN_SIG=$(find release-flat -name '*.nsis.zip.sig' | head -n 1)
          if [ -z "$WIN_SIG" ]; then
            # Fallback: any non-macOS signature (e.g. -setup.exe.sig for NSIS,
            # or an .msi.zip.sig if MSI is the updater target).
            WIN_SIG=$(find release-flat -name '*.sig' ! -name '*.app.tar.gz.sig' | head -n 1)
          fi
          MAC_GZ="${MAC_SIG%.sig}"
          WIN_ZIP="${WIN_SIG%.sig}"
          echo "macOS bundle : $MAC_GZ"
          echo "macOS sig    : $MAC_SIG"
          echo "Windows bundle: $WIN_ZIP"
          echo "Windows sig   : $WIN_SIG"
          # Signing must be configured - the updater verifies against the pubkey
          # embedded in the app, so unsigned bundles cannot be installed.
          if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ]; then
            echo "::error::Missing updater signature. Set TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets."
            exit 1
          fi
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES=$(cat release_body.md)
          # jq JSON-escapes the notes + signatures.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_sig "$(cat "$MAC_SIG")" \
            --arg mac_url "${BASE}/$(basename "$MAC_GZ")" \
            --arg win_sig "$(cat "$WIN_SIG")" \
            --arg win_url "${BASE}/$(basename "$WIN_ZIP")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > release-flat/latest.json
          echo "---- latest.json ----"
          cat release-flat/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: DocuSync ${{ needs.bump-version.outputs.tag }}
          body_path: release_body.md
          files: release-flat/*
