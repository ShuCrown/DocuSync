name: Tauri Desktop Build

# Build native Tauri desktop bundles on push to main.
# Triggered only when source code or build config actually changes,
# so edits to README/docs don't waste CI minutes.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msi,*.exe -Path src-tauri/target/release/bundle | Select-Object -ExpandProperty FullName

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuSync-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuSync-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
