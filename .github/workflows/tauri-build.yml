name: Tauri Desktop Build & Release

# 版本号人控（单一来源）：
#   `src-tauri/tauri.conf.json` 的 version 字段是唯一版本来源，想发版就手动改它并 push。
#   master 源码变更会自动重建并刷新对应版本的 draft Release（AskAll 同款策略）：
#     - 版本号没变      → 更新已有 draft 的产物与说明（--clobber）
#     - 版本号变了      → 创建新 tag vX.Y.Z 与新的 draft
#     - 该版本已正式发布 → 跳过，绝不覆盖已发布的版本
#   草稿需在 GitHub 页面人工确认后发布；发布前 updater 端点
#   （releases/latest/download/latest.json）不会被解析。
on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支同时只允许一个发布流程运行：后到的排队等待而不是取消。
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  prepare:
    name: Read version & changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      changes: ${{ steps.read.outputs.changes }}
    steps:
      # fetch-depth: 0 拉取全部历史与 tag，用于生成自上一版本以来的提交记录
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version & changelog
        id: read
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 自上一版本 tag 以来的提交记录；尚无 tag 时取最近 30 条
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last_tag" ]; then
            changes=$(git log "$last_tag"..HEAD --oneline --no-merges)
          else
            changes=$(git log --oneline --no-merges -n 30)
          fi
          if [ -z "$changes" ]; then
            changes="（当前版本无新提交）"
          fi
          # 多行内容必须使用 heredoc 分隔符语法，否则 GITHUB_OUTPUT 报 "Invalid format"
          {
            echo "CHANGES<<DOCUSYNC_EOF"
            printf '%s\n' "$changes"
            echo "DOCUSYNC_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64
            artifact_name: DocuSync-windows-x64
          - platform: macos-latest
            name: macOS ARM64
            artifact_name: DocuSync-macos-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      # tauri.conf.json 是唯一版本来源；构建时把版本同步到 Cargo.toml /
      # package.json（仅本次构建生效，不回写仓库），保证三处与发布版本一致。
      - name: Sync version files
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          sed -i -E '0,/^version = "[0-9.]+"$/ s/^version = "[0-9.]+"$/version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          tmp2=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' package.json > "$tmp2" && mv "$tmp2" package.json
          echo "---- synced versions ----"
          jq -r '.version' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml
          jq -r '.version' package.json

      # Cargo cache restores src-tauri/target, which carries stale bundle/
      # installers from an earlier release (e.g. a 0.0.2 .exe/.msi). Without
      # cleaning, the upload glob below publishes those old artifacts into the
      # new release. Remove the bundle output so only the current version ships.
      # shell: bash is required — the Windows runner defaults to pwsh, where
      # `rm -rf` is invalid and would fail this step.
      - name: Clean stale bundle artifacts
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          # Signing key for the updater bundles (.sig). Without these the build
          # produces unsigned updater artifacts and the release step will fail.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse -Path src-tauri/target/release/bundle | Select-Object -ExpandProperty FullName

      - name: List build output (macOS)
        if: runner.os == 'macOS'
        run: find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null | sort

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  release:
    name: Create / update draft GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # gh release 需要在 git 仓库上下文操作（创建 tag 等），必须先 checkout
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: release

      - name: Write release notes
        run: |
          # 多行内容用带引号的 heredoc 写入；模板表达式在步骤执行前已被 GitHub 替换
          cat > release_body.md <<'DOCUSYNC_NOTES_EOF_7f3a'
          # DocuSync v${{ needs.prepare.outputs.version }}

          ## 本次更新

          ${{ needs.prepare.outputs.changes }}

          ## 下载资源

          - **Windows**: \`.msi\` (安装包) / \`.exe\` (NSIS 安装包)
          - **macOS**: \`.dmg\` (磁盘镜像，Apple Silicon ARM64)
          DOCUSYNC_NOTES_EOF_7f3a
          echo "---- release_body.md ----"
          cat release_body.md

      - name: Flatten release directory
        run: |
          mkdir -p release-flat
          find release -type f -exec cp {} release-flat/ \;
          echo "---- release tree ----"
          find release -type f | sort
          echo "---- flattened ----"
          ls -la release-flat

      - name: Generate updater manifest (latest.json)
        run: |
          BASE="https://github.com/ShuCrown/DocuSync/releases/download/${TAG}"
          # Updater artifacts are the only build outputs with a .sig sidecar.
          # Discover them by signature so this is robust to Tauri's exact naming
          # (2.11.4 omits the version, e.g. DocuSync.app.tar.gz).
          echo "All signature files:"; find release-flat -name '*.sig' | sort
          MAC_SIG=$(find release-flat -name '*.app.tar.gz.sig' | head -n 1)
          WIN_SIG=$(find release-flat -name '*.nsis.zip.sig' | head -n 1)
          if [ -z "$WIN_SIG" ]; then
            # Fallback: any non-macOS signature (e.g. -setup.exe.sig for NSIS,
            # or an .msi.zip.sig if MSI is the updater target).
            WIN_SIG=$(find release-flat -name '*.sig' ! -name '*.app.tar.gz.sig' | head -n 1)
          fi
          MAC_GZ="${MAC_SIG%.sig}"
          WIN_ZIP="${WIN_SIG%.sig}"
          echo "macOS bundle : $MAC_GZ"
          echo "macOS sig    : $MAC_SIG"
          echo "Windows bundle: $WIN_ZIP"
          echo "Windows sig   : $WIN_SIG"
          # Signing must be configured - the updater verifies against the pubkey
          # embedded in the app, so unsigned bundles cannot be installed.
          if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ]; then
            echo "::error::Missing updater signature. Set TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets."
            exit 1
          fi
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES=$(cat release_body.md)
          # jq JSON-escapes the notes + signatures.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_sig "$(cat "$MAC_SIG")" \
            --arg mac_url "${BASE}/$(basename "$MAC_GZ")" \
            --arg win_sig "$(cat "$WIN_SIG")" \
            --arg win_url "${BASE}/$(basename "$WIN_ZIP")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > release-flat/latest.json
          echo "---- latest.json ----"
          cat release-flat/latest.json

      # AskAll 同款逻辑：版本号没变 → 更新已有 draft；版本号变了 → 创建新
      # tag + draft；该版本已正式发布 → 跳过。上传后逐一校验产物是否都在
      # assets 中（尤其 latest.json / .sig 这类 updater 关键文件）。
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集全部已下载的产物文件（已摊平为文件，无目录展开问题）
          mapfile -t files < <(find release-flat -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifact files found"
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s):"
          printf '%s\n' "${files[@]}"

          # uploaded=1 表示本次确实执行了上传，随后需要校验产物完整性
          uploaded=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "Draft release $TAG 已存在，更新附件与说明…"
              gh release upload "$TAG" "${files[@]}" --clobber
              gh release edit "$TAG" \
                --title "DocuSync v$VERSION" \
                --notes-file release_body.md \
                --draft
              uploaded=1
            else
              echo "Release $TAG 已正式发布，跳过自动更新"
            fi
          else
            echo "创建新 draft release $TAG …"
            gh release create "$TAG" \
              --title "DocuSync v$VERSION" \
              --notes-file release_body.md \
              --draft \
              "${files[@]}"
            uploaded=1
          fi

          # 上传后校验：逐一确认本地产物都已出现在 release assets 中，防止静默丢失
          if [ "$uploaded" = "1" ]; then
            echo "=== 校验产物是否全部上传成功 ==="
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/release_assets.txt
            missing=0
            for f in "${files[@]}"; do
              base=$(basename "$f")
              if ! grep -qxF "$base" /tmp/release_assets.txt; then
                echo "::error::Release 缺少产物: $base"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "::error::产物上传校验失败，请检查上面的缺失列表"
              echo "当前 Release assets："
              cat /tmp/release_assets.txt
              exit 1
            fi
            echo "校验通过：${#files[@]} 个产物均已上传到 Release $TAG"
          fi
